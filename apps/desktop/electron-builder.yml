appId: in.devalan.noted
productName: Noted
copyright: Copyright © 2026 Alan Ansari
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
asar: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: alanansari
  repo: notesapp
